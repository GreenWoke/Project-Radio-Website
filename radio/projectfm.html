<div class="container">

    <div class="player-title-box">PROJECT.FM PLAYER</div>
    <div class="dos-player">
      <audio id="audio" autoplay>
        <source src="https://signal.projectradio.org/listen/prfm/radio.mp3" type="audio/mpeg" />
        Your browser does not support the audio element.

        <button class="control-btn" id="refresh-btn" aria-label="Refresh">↻</button>
      </div>

      <input type="range" id="volume" min="0" max="1" step="0.01" value="1" />
      <label for="volume">Volume</label>
    </div>
  </section>

<script>
  // -------------------
  // AUDIO PLAYER CONTROLS
  // -------------------
  const audio = document.getElementById('audio');
  const volumeSlider = document.getElementById('volume');
  const playBtn = document.getElementById('play-btn');
  const pauseBtn = document.getElementById('pause-btn');
  const refreshBtn = document.getElementById('refresh-btn');

  // Set initial volume
  audio.volume = volumeSlider.value;

  // Autoplay attempt
  window.addEventListener('load', () => {
    const playAttempt = audio.play();
    if (playAttempt !== undefined) playAttempt.catch(() => console.warn("Autoplay was blocked by the browser."));
  });

  // Control events
  volumeSlider.addEventListener('input', () => { audio.volume = volumeSlider.value; });
  playBtn.addEventListener('click', () => { audio.play(); });
  pauseBtn.addEventListener('click', () => { audio.pause(); });
  refreshBtn.addEventListener('click', () => { audio.pause(); audio.currentTime = 0; audio.load(); audio.play(); });

const NOW_PLAYING_API = "https://signal.projectradio.org/api/nowplaying_static/prfm.json";

const npPopup = document.getElementById("nowPlayingPopup");
const npTitle = document.getElementById("np-title");
const npArtist = document.getElementById("np-artist");
const npArt = document.getElementById("np-art");


async function updateNowPlaying() {
  try {
    const res = await fetch(NOW_PLAYING_API);
    const data = await res.json();
    const song = data.now_playing.song;
    console.log(song);
  

    npTitle.textContent = song.title || "Unknown Track";
    npArtist.textContent = song.artist || "";
    npArt.src = song.art || "https://projectradio.org/trrransperent.png"; 
    npPopup.classList.remove("hidden"); 
  } catch (err) {
    console.error("Failed to fetch now playing:", err);
    npTitle.textContent = "Unable to load track";
    npArtist.textContent = "";
    npArt.src = "../trrransperent.png";
  }
}

// Initial fetch
updateNowPlaying();

// Poll every 15 seconds
setInterval(updateNowPlaying, 15000);
</script>
