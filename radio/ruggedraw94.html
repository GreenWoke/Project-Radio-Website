  <!--  Audio Script -->
<script>
/* ================= AUDIO PLAYER ================= */
const audio = document.getElementById("audio");
const volumeSlider = document.getElementById("volume-slider");

function playAudio() {
  audio.play();
}

function pauseAudio() {
  audio.pause();
}

function refreshStream() {
  audio.src = "https://radio.projectradio.org/listen/ruggedraw94/radio.mp3?ts=" + new Date().getTime();
  audio.load();
  audio.play();
}

volumeSlider.addEventListener("input", () => {
  audio.volume = volumeSlider.value;
});

document.querySelector('.top-left-nav').addEventListener('click', function () {
  this.classList.toggle('active');
});


/* ================= DRAWING (DESKTOP ONLY) ================= */
if (window.innerWidth > 768) {
  const canvas = document.getElementById('graffitiCanvas');
  const ctx = canvas.getContext('2d');

  const colorInput = document.getElementById('brush-color');
  const sizeInput = document.getElementById('brush-size');

  let brushColor = colorInput.value;
  let brushSize = parseInt(sizeInput.value);
  let drawing = false;

  colorInput.addEventListener('input', () => brushColor = colorInput.value);
  sizeInput.addEventListener('input', () => brushSize = parseInt(sizeInput.value));

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function clearCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  window.clearCanvas = clearCanvas;

  function spray(x, y) {
    const density = 50;
    for (let i = 0; i < density; i++) {
      const angle = Math.random() * 2 * Math.PI;
      const radius = Math.random() * brushSize;
      const offsetX = Math.cos(angle) * radius;
      const offsetY = Math.sin(angle) * radius;
      ctx.fillStyle = brushColor;
      ctx.fillRect(x + offsetX, y + offsetY, 1, 1);
    }
  }

  function getMousePos(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  function startDrawing(e) {
    drawing = true;
    sprayLoop(e);
  }

  function stopDrawing() {
    drawing = false;
  }

  function sprayLoop(e) {
    if (!drawing) return;
    const { x, y } = getMousePos(e);
    spray(x, y);
    requestAnimationFrame(() => sprayLoop(e));
  }

  canvas.addEventListener('mousedown', startDrawing);
  canvas.addEventListener('mouseup', stopDrawing);
  canvas.addEventListener('mouseout', stopDrawing);
  canvas.addEventListener('mousemove', (e) => {
    if (drawing) spray(e.clientX, e.clientY);
  });
}


/* ================= NOW PLAYING ================= */
const NOW_PLAYING_URL = "https://signal.projectradio.org/api/nowplaying_static/ruggedraw94.json";

let lastSong = "";
let isPinned = false;
let hideTimeout; //  important fix

const popup = document.getElementById("nowPlayingPopup");
const pinBtn = document.getElementById("pinBtn");

pinBtn.addEventListener("click", () => {
  isPinned = !isPinned;

  popup.classList.toggle("pinned", isPinned);
  pinBtn.textContent = isPinned ? "📍" : "📌";

  //  stop any pending hide when pinned
  if (isPinned) {
    clearTimeout(hideTimeout);
  } else {
    // restart hide timer when unpinned
    hideTimeout = setTimeout(() => {
      popup.classList.remove("show");
      setTimeout(() => popup.classList.add("hidden"), 400);
    }, 6000);
  }
});

async function fetchNowPlaying() {
  try {
    const res = await fetch(NOW_PLAYING_URL);
    const data = await res.json();

    const song = data?.now_playing?.song;
    if (!song) return;

    const currentSong = song.artist + " - " + song.title;

    if (currentSong !== lastSong) {
      lastSong = currentSong;
      showNowPlaying(song);
    }
  } catch (err) {
    console.error("Now playing fetch failed:", err);
  }
}

function showNowPlaying(song) {
  document.getElementById("np-title").textContent = song.title || "Unknown Track";
  document.getElementById("np-artist").textContent = song.artist || "";
  document.getElementById("np-art").src = song.art || "";

  popup.classList.remove("hidden");

  setTimeout(() => popup.classList.add("show"), 50);

  //  clear old timers before setting new one
  clearTimeout(hideTimeout);

  if (!isPinned) {
    hideTimeout = setTimeout(() => {
      popup.classList.remove("show");
      setTimeout(() => popup.classList.add("hidden"), 400);
    }, 6000);
  }
}

// Run polling ONCE
setInterval(fetchNowPlaying, 15000);
fetchNowPlaying();
</script>
