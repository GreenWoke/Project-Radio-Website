<script>
// --- Rain Effect Script ---
requestAnimFrame = (function() {
  return window.requestAnimationFrame ||
         window.webkitRequestAnimationFrame ||
         window.mozRequestAnimationFrame ||
         window.oRequestAnimationFrame ||
         window.msRequestAnimationFrame ||
         function(callback){ window.setTimeout(callback, 1000/60); };
})();

var canvas = document.getElementById('canvas');
var ctx = canvas.getContext('2d');
var width = 0, height = 0;
window.onresize = function() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
};
window.onresize();

var mouse = { X:0, Y:0 };
window.onmousemove = function(e){ mouse.X = e.clientX; mouse.Y = e.clientY; };

var particules = [], gouttes = [];
var nombrebase = 5, nombreb = 2;
var controls = { rain:2, Object:"Nothing", alpha:1, color:200, auto:false, opacity:1, saturation:100, lightness:50, back:100, red:0, green:0, blue:0, multi:false, speed:2 };

function Rain(X,Y,nombre){ if(!nombre) nombre=nombreb; while(nombre--) { particules.push({ vitesseX:(Math.random()*0.25), vitesseY:(Math.random()*9)+1, X:X, Y:Y, alpha:1, couleur:"rgba(0,166,146,0.23)" }); } }
function explosion(X,Y,couleur,nombre){ if(!nombre) nombre=nombrebase; while(nombre--) { gouttes.push({ vitesseX:(Math.random()*4-2), vitesseY:(Math.random()*-4), X:X, Y:Y, radius:0.65+Math.random()*1.6, alpha:1, couleur:couleur }); } }

function rendu(ctx){
  ctx.save(); ctx.clearRect(0,0,width,height);
  var tau=Math.PI*2;
  particules.forEach(p=>{ ctx.globalAlpha=p.alpha; ctx.fillStyle=p.couleur; ctx.fillRect(p.X,p.Y,p.vitesseY/4,p.vitesseY); });
  gouttes.forEach(g=>{ ctx.globalAlpha=g.alpha; ctx.fillStyle=g.couleur; ctx.beginPath(); ctx.arc(g.X,g.Y,g.radius,0,tau); ctx.fill(); });
  ctx.restore();
}

function update(){
  particules.forEach((p,i)=>{ p.X+=p.vitesseX; p.Y+=p.vitesseY+5; if(p.Y>height-15){ particules.splice(i,1); explosion(p.X,p.Y,p.couleur); } });
  gouttes.forEach((g,i)=>{ g.X+=g.vitesseX; g.Y+=g.vitesseY; g.radius-=0.075; g.alpha-=0.005; if(g.radius<0) gouttes.splice(i,1); });
  for(var i=controls.rain;i--;) Rain(Math.floor(Math.random()*width),-15);
}

(function boucle(){ requestAnimFrame(boucle); update(); rendu(ctx); })();
</script>

<script>
  const audio = document.getElementById("audio");
  const volumeSlider = document.getElementById("volume");
  const playBtn = document.getElementById("play-btn");
  const pauseBtn = document.getElementById("pause-btn");
  const refreshBtn = document.getElementById("refresh-btn");

  audio.volume = volumeSlider.value;

  window.addEventListener("load", () => {
    const playAttempt = audio.play();
    if (playAttempt !== undefined) {
      playAttempt.catch(() => { console.warn("Autoplay was blocked."); });
    }
  });

  volumeSlider.addEventListener("input", () => { audio.volume = volumeSlider.value; });
  playBtn.addEventListener("click", () => { audio.play(); });
  pauseBtn.addEventListener("click", () => { audio.pause(); });
  refreshBtn.addEventListener("click", () => {
    audio.pause(); audio.currentTime = 0; audio.load(); audio.play();
  });

  const NOW_PLAYING_API = "https://signal.projectradio.org/api/nowplaying_static/dogstarfm.json";

  const npPopup = document.getElementById("nowPlayingPopup");
  const npTitle = document.getElementById("np-title");
  const npArtist = document.getElementById("np-artist");
  const npArt = document.getElementById("np-art");

  async function updateNowPlaying() {
    try {
      const res = await fetch(NOW_PLAYING_API);
      const data = await res.json();
      const song = data.now_playing.song;

      npTitle.textContent = song.title || "Unknown Track";
      npArtist.textContent = song.artist || "";
      npArt.src = song.art || "https://projectradio.org/trrransperent.png";
    } catch(err) {
      console.error("Failed to fetch now playing:", err);
      npTitle.textContent = "Unable to load track";
      npArtist.textContent = "";
      npArt.src = "../trrransperent.png";
    }
  }

  // Initial fetch
  updateNowPlaying();

  // Poll every 15 seconds
  setInterval(updateNowPlaying, 15000);
</script>
