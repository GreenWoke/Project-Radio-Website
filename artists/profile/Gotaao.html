<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gotaao</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: 'Press Start 2P', cursive, monospace;
      color: #333;
      user-select: none;
    }

    /* ===============================
       BACKGROUND VIDEO
       =============================== */
    #bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
      background-color: black; /* fallback */
    }


    /* ===============================
       MAIN PAGE CONTENT
       =============================== */
    body {
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }

    h2, h3 { user-select: text; }

    .page-wrapper {
      display: flex;
      flex-direction: column;
      max-width: 960px;
      width: 100%;
      gap: 1rem;
      position: relative;
      z-index: 1; /* keeps content above video */
    }

    /* ===============================
       HOSTED BY / RETURN BUTTON
       =============================== */
    .uplink-box { 
      position: fixed; 
      bottom: 20px; 
      left: 50%; 
      transform: translateX(-50%); 
      cursor: pointer; 
      max-width: 100px; 
      width: 100%; 
      text-align: center; 
      user-select: none; 
      z-index: 2; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      text-decoration: none; 
    }
    .uplink-box img { 
      max-height: 32px; 
      height: auto; 
      border-radius: 8px; 
      display: block; 
      margin: 0 auto; 
      pointer-events: none; 
      filter: drop-shadow(1px 1px 2px white); 
    }
    .uplink-box .hosted-by { 
      font-size: 14px; 
      color: #333; 
      text-decoration: none; 
      text-shadow: 1px 1px 2px white; 
      margin-bottom: 4px; 
      user-select: none; 
      display: block; 
    }

    /* ===============================
       PROFILE CONTAINER
       =============================== */
    .profile-container {
      display: flex;
      flex-direction: row;
      background: rgba(255, 255, 255, 0.9);
      border: 2px solid #ccc;
      border-radius: 12px;
      overflow: hidden;
    }

    /* ===============================
       SIDEBAR
       =============================== */
    .sidebar {
      width: 300px;
      padding: 1.5rem 1rem;
      background: #f9f9f9cc;
      border-right: 2px solid #ccc;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .profile-pic {
      width: 250px;
      height: 250px;
      background: url('https://projectradio.org/artists/images/Gotaao_head.jpeg') center/cover no-repeat;
      border: 4px solid #ccc;
      border-radius: 12px;
      cursor: pointer;
    }
    .basic-info {
      margin-top: 1.5rem;
      width: 100%;
      background: #f5f5f5cc;
      border: 2px solid #ccc;
      border-radius: 10px;
      padding: 1rem;
    }
    .basic-info h2 { margin-bottom: 0.5rem; font-size: 1rem; }
    .basic-info p { margin: 0.3rem 0; font-size: 0.8rem; }

    /* ===============================
       CONTENT AREA
       =============================== */
    .content-area {
      flex: 1;
      padding: 2rem;
      background: #ffffffcc;
    }
    .content-area h3 {
      font-size: 1rem;
      border-bottom: 2px solid #ccc;
      padding-bottom: 0.4rem;
      margin-bottom: 1rem;
    }
    .links a {
      display: inline-block;
      background: #eee;
      border: 2px solid #ccc;
      color: #333;
      text-decoration: none;
      padding: 0.4rem 1rem;
      margin-right: 0.5rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .links a:hover { background: #ddd; }

    .gallery {
      margin-top: 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .gallery img {
      width: 160px;
      height: 160px;
      object-fit: cover;
      border: 2px solid #ccc;
      border-radius: 10px;
      cursor: pointer;
    }

    /* ===============================
       RESPONSIVE DESIGN
       =============================== */
    @media (max-width: 768px) {
      .profile-container { flex-direction: column; }
      .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 2px solid #ccc;
        align-items: center;
      }
      .profile-pic {
        width: 80%;
        max-width: 200px;
        height: auto;
      }
      .basic-info { font-size: 0.9rem; padding: 1rem; }
      .content-area { font-size: 0.95rem; padding: 1rem; }
      .gallery img { width: 45%; height: auto; }
    }
  </style>
</head>

<body>
  <!-- Background video -->
  <video autoplay muted loop playsinline id="bg-video">
    <source src="https://projectradio.org/artists/images/gotaao_bg.mp4" type="video/mp4">
  </video>

  <!-- Optional overlay for readability -->
  <div id="video-overlay"></div>

  <div class="page-wrapper">
    <!-- HOSTED BY BUTTON -->
    <a href="/artists/uplink.html" class="uplink-box" aria-label="Return to Uplink page">
      <span class="hosted-by">Hosted by</span>
      <img src="https://projectradio.org/R-Transparent.png" alt="Uplink Logo" />
    </a>

    <!-- PROFILE CONTAINER -->
    <div class="profile-container">

      <!-- SIDEBAR -->
      <aside class="sidebar">
        <div class="profile-pic" tabindex="0" aria-label="Artist profile picture"></div>

        <div class="basic-info">
          <h2>About</h2>
          <p><strong>Location:</strong> [City, Country]</p>
          <p><strong>Mediums:</strong> [e.g., Producer, DJ, Composer]</p>

          <h2>Favourites</h2>
          <p><strong>Album:</strong> [Title]</p>
          <p><strong>Movie:</strong> [Title]</p>
        </div>
      </aside>

      <!-- CONTENT AREA -->
      <section class="content-area">
        <h3>[Artist Name]</h3>
        <p>[Short artist bio or description goes here. Mention genre, style, influences, etc.]</p>

        <h3>Links &amp; Work</h3>
        <div class="links">
          <a href="#">Website</a>
          <a href="#">SoundCloud</a>
          <a href="#">Twitter</a>
          <a href="#">Bandcamp</a>
        </div>

        <h3>Showcase</h3>
        <div class="gallery">
          <img src="https://via.placeholder.com/160?text=Artwork+1" alt="Showcase Item 1" />
          <img src="https://via.placeholder.com/160?text=Artwork+2" alt="Showcase Item 2" />
          <img src="https://via.placeholder.com/160?text=Artwork+3" alt="Showcase Item 3" />
        </div>
      </section>

    </div>
  </div>
</body>
</html>
