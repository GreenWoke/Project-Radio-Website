  <script>
    const showcases = {
      designs: [
        { type: 'image', src: 'https://merlverse.neocities.org/stucksaki.png', alt: 'Merlin graphic design 1' },
        { type: 'image', src: 'https://merlverse.neocities.org/stickysaki.png', alt: 'Merlin graphic design 2' },
        { type: 'image', src: 'https://merlverse.neocities.org/celine-saab.png', alt: 'Merlin graphic design 2' },
        { type: 'image', src: 'https://merlverse.neocities.org/tahoes14.png', alt: 'Merlin web design example' },
        { type: 'image', src: 'https://merlverse.neocities.org/meow.png', alt: 'Merlin graphic design 4' },
        { type: 'image', src: 'https://merlverse.neocities.org/shecrazybrazy.png', alt: 'Merlin graphic design 5' }
      ],
      music: [
        { type: 'audio', src: 'https://projectradio.org/artists/sounds/Shape.mp3' }
      ],
      video: [
        { type: 'video', src: 'https://projectradio.org/artists/images/organic.dancer.mp4' }
      ]
    };

    let currentMode = 'designs';
    let currentIndex = 0;

    function renderItem() {
      const container = document.getElementById('carousel-media');
      container.innerHTML = ''; 

      const item = showcases[currentMode][currentIndex];
      if (!item) return;

      let media;
      if (item.type === 'image') {
        media = document.createElement('img');
        media.src = item.src;
        media.alt = item.alt || '';
      } else if (item.type === 'audio') {
        media = document.createElement('audio');
        media.controls = true;
        media.src = item.src;
        media.setAttribute('aria-label', 'Audio track');
      } else if (item.type === 'video') {
        media = document.createElement('video');
        media.src = item.src;
        media.controls = true;
        media.autoplay = false;
        media.loop = false;
        media.muted = true;
        media.setAttribute('aria-label', 'Video track');
      }
      container.appendChild(media);
    }

    function switchMode(mode) {
      if (mode === currentMode) return;
      currentMode = mode;
      currentIndex = 0;
      renderItem();
      updateButtons();
    }

    function updateButtons() {
      document.querySelectorAll('.mode-selector button').forEach(btn => {
        if (btn.id === `mode-${currentMode}`) {
          btn.classList.add('active');
          btn.setAttribute('aria-selected', 'true');
          btn.tabIndex = 0;
        } else {
          btn.classList.remove('active');
          btn.setAttribute('aria-selected', 'false');
          btn.tabIndex = -1;
        }
      });
    }

    function nextItem() {
      const length = showcases[currentMode].length;
      currentIndex = (currentIndex + 1) % length;
      renderItem();
    }

    function prevItem() {
      const length = showcases[currentMode].length;
      currentIndex = (currentIndex - 1 + length) % length;
      renderItem();
    }

    window.onload = () => {
      renderItem();
      updateButtons();
    };

    /* ADDED: Popup GIF click logic */
    document.getElementById("triggerGif").addEventListener("click", () => {
      const overlay = document.getElementById("gifOverlay");
      const popupGif = document.getElementById("popupGif");

      popupGif.src = popupGif.src; 
      overlay.style.display = "flex";

      setTimeout(() => {
        overlay.style.display = "none";
      }, 3000);
    });

  </script>
