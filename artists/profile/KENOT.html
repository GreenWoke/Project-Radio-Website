<!DOCTYPE html>
<html lang="en">

<!-- Mirrored from projectradio.org/artists/profile/KENOT by HTTrack Website Copier/3.x [XR&CO'2014], Tue, 28 Jul 2026 08:53:09 GMT -->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/x-icon" href="../images/allycat.ico">

  <title>Kenot</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');

    html, body {
      margin: 0;
      padding: 0;
      background-color: #000;
      color: #fff;
      font-family: 'Share Tech Mono', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 2rem 1rem;
      user-select: none;
      image-rendering: pixelated;
      overflow-x: hidden;
      cursor: none;
    }

    /* Halftone background */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-image:
        radial-gradient(#fff 1px, transparent 1px),
        radial-gradient(#fff 1px, transparent 1px);
      background-size: 8px 8px;
      background-position: 0 0, 4px 4px;
      opacity: 0.1;
      animation: halftoneMove 8s linear infinite;
      z-index: 0;
      pointer-events: none;
    }

    @keyframes halftoneMove {
      0% { background-position: 0 0, 4px 4px; }
      100% { background-position: 8px 8, 12px 12px; }
    }

    h2, h3 { user-select: text; }

    .page-wrapper {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 960px;
      width: 100%;
      gap: 1rem;
      border: 4px solid #fff;
      background: #111;
      box-shadow: inset 0 0 0 2px #fff, 4px 4px 0 #666;
      padding: 0.5rem;
    }

    .profile-container {
      display: flex;
      flex-direction: row;
      border: 3px solid #fff;
      background: #000;
      box-shadow: 3px 3px 0 #fff;
      border-radius: 4px;
      overflow: hidden;
      transition: transform 0.2s ease-in-out;
      aspect-ratio: 1 / 1;
      max-height: 700px;
      width: 100%;
    }

    .profile-container:hover {
      transform: scale(1.01);
    }

    .sidebar {
      flex: 0.4;
      max-width: 350px;
      padding: 1rem;
      border-right: 2px dotted #fff;
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    .profile-pic {
      width: 180px;
      height: 180px;
      background: url('../images/kenot_head.png') center/cover no-repeat;
      border: 3px solid #fff;
      image-rendering: pixelated;
      margin-bottom: 1rem;
      box-shadow: inset 0 0 0 2px #000, 2px 2px 0 #fff;
      transition: transform 0.2s ease;
    }

    .profile-pic:hover {
      transform: scale(1.05);
    }

    .basic-info {
      width: 100%;
      border: 2px dotted #fff;
      background: #000;
      padding: 0.8rem;
      box-shadow: inset 0 0 5px rgba(255,255,255,0.1);
    }

    .basic-info h2 {
      font-size: 0.8rem;
      border-bottom: 1px dotted #fff;
      padding-bottom: 0.3rem;
      margin-bottom: 0.5rem;
      color: #fff;
    }

    .basic-info p {
      font-size: 0.65rem;
      line-height: 1.6;
      color: #ddd;
    }

    .content-area {
      flex: 0.6;
      padding: 1rem 1.2rem;
      background: #000;
      color: #fff;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    .content-area h3 {
      font-size: 0.9rem;
      border-bottom: 2px dotted #fff;
      padding-bottom: 0.4rem;
      margin-bottom: 1rem;
    }

    .links a {
      display: inline-block;
      background: #000;
      border: 2px solid #fff;
      color: #fff;
      text-decoration: none;
      padding: 0.3rem 0.8rem;
      margin: 0.3rem 0.3rem 0.3rem 0;
      border-radius: 0;
      font-size: 0.7rem;
      box-shadow: 2px 2px 0 #fff;
      transition: all 0.1s ease-in;
    }

    .links a:hover {
      background: #fff;
      color: #000;
      box-shadow: none;
    }

    /* ===============================
       SHOWCASE CAROUSEL — Single image with arrows
       =============================== */
    .carousel-container {
      position: relative;
      width: 100%;
      max-width: 100%;
      height: 320px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 1rem;
      overflow: hidden;
      background: #000;
    }

    .carousel-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
      transition: opacity 0.3s ease;
    }

    .carousel-button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: #000;
      border: 2px solid #fff;
      color: #fff;
      padding: 0.5rem;
      cursor: pointer;
      font-size: 1.2rem;
      z-index: 2;
      box-shadow: 2px 2px 0 #fff;
    }

    .carousel-button:hover {
      background: #fff;
      color: #000;
      box-shadow: none;
    }

    .carousel-button.prev {
      left: 10px;
    }
    .carousel-button.next {
      right: 10px;
    }

    /* ===============================
       HOSTED BY BOX
       =============================== */
    .uplink-box { 
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      text-decoration: none;
      border: 2px dotted #fff;
      background: #000;
      padding: 0.5rem 1rem;
      border-radius: 0;
      box-shadow: 2px 2px 0 #fff;
      transition: all 0.1s ease-in;
      margin: 1.5rem auto 2rem auto;
      width: fit-content;
      z-index: 5;
    }

    .uplink-box:hover {
      background: #fff;
    }

    .uplink-box:hover .hosted-by,
    .uplink-box:hover img {
      filter: invert(1);
    }

    .uplink-box img { 
      max-height: 32px;
      display: block;
      margin: 0 auto; 
      filter: invert(1);
    }

    .uplink-box .hosted-by { 
      font-size: 10px; 
      color: #fff; 
      margin-bottom: 4px; 
    }

    /* ===============================
       FAKE CURSOR
       =============================== */
    #custom-cursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 24px;
      height: 24px;
      pointer-events: none;
      z-index: 10000;
      background: url("../images/allycat.ico") center/contain no-repeat;
      image-rendering: pixelated;
    }

    @media (max-width: 768px) {
      .profile-container { 
        flex-direction: column;
        aspect-ratio: auto;
        max-height: none;
      }
      .sidebar {
        flex: unset;
        width: 100%;
        border-right: none;
        border-bottom: 2px dotted #fff;
      }
      .profile-pic {
        width: 70%;
        height: auto;
      }
      .carousel-container {
        height: 250px;
      }
    }
  </style>
</head>

<body>
  <div id="custom-cursor"></div>

  <div class="page-wrapper">
    <div class="profile-container">

      <!-- SIDEBAR -->
      <aside class="sidebar">
        <div class="profile-pic" tabindex="0" aria-label="Artist profile picture"></div>
        <div class="basic-info">
          <h2>About</h2>
          <p><strong>Location:</strong> Norway</p>
          <p><strong>Mediums:</strong> Visual Art</p>

          <h2>Favourites</h2>
          <p><strong>Album:</strong> Nurture - Porter Robinson</p>
          <p><strong>Movie:</strong> Everything Everywhere All At Once</p>
        </div>
      </aside>

      <!-- CONTENT -->
      <section class="content-area">
        <h3>Kenot</h3>
        <p>I'm just a guy that makes stuff</p>

        <h3>Links &amp; Work</h3>
        <div class="links">
          <a href="https://x.com/KENOT_">Twitter</a>
          <a href="https://www.instagram.com/kenot.ig/">Instagram</a>
        </div>

        <h3>Showcase</h3>
        <div class="carousel-container">
          <button class="carousel-button prev">&#9664;</button>
          <img src="../images/Mina_ha.gif" alt="Showcase" class="carousel-image">
          <button class="carousel-button next">&#9654;</button>
        </div>
      </section>

    </div>
  </div>

  <a href="../uplink.html" class="uplink-box" aria-label="Return to Uplink page">
    <span class="hosted-by">Hosted by</span>
    <img src="../../R-Transparent.png" alt="Uplink Logo" />
  </a>

  <script>
    // FAKE CURSOR FOLLOW
    const cursor = document.getElementById('custom-cursor');
    document.addEventListener('mousemove', e => {
      cursor.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;
    });

    // CAROUSEL FUNCTIONALITY
    const images = [
      "https://projectradio.org/artists/images/Mina_ha.gif",
      "../images/5%20color%20-%20kennet%20langoey.png",
      "../images/blue%20-%20kennet%20langoey.jpg",
      "../images/kenothing.png",
      "https://pbs.twimg.com/media/G1Y3zfYWQAAmZ0w?format=jpg&amp;name=4096x4096"
    ];

    let currentIndex = 0;
    const carouselImg = document.querySelector('.carousel-image');
    const prevBtn = document.querySelector('.carousel-button.prev');
    const nextBtn = document.querySelector('.carousel-button.next');

    function showImage(index) {
      carouselImg.src = images[index];
    }

    prevBtn.addEventListener('click', () => {
      currentIndex = (currentIndex - 1 + images.length) % images.length;
      showImage(currentIndex);
    });

    nextBtn.addEventListener('click', () => {
      currentIndex = (currentIndex + 1) % images.length;
      showImage(currentIndex);
    });
  </script>
</body>
